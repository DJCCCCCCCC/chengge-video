services:
  yingyu:
    image: chengge-video:2026.10.13-arm64
    platform: linux/arm64
    pull_policy: never
    ports:
      - "${NAS_BIND_IP:-0.0.0.0}:${PORT:-4300}:4300"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4300
      DATA_DIR: /app/data
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set a unique ADMIN_PASSWORD of at least 12 characters in .env}"
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-false}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-2048}"
    volumes:
      - video-data:/app/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  video-data:
